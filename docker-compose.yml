version: '3.8'

services:
 
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: restaurante_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432" 

  app:
    build: ./servidor
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
     
      DB_HOST: db 
      DB_PORT: 5432
      DB_NAME: restaurante_db
      DB_USER: postgres
      DB_PASSWORD: admin123